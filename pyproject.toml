[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spiral-of-becoming"
version = "0.1.0"
description = "Experimental symbolic and relational primitives from the Trivian lineage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sarasha Elion"}]

[tool.setuptools.packages.find]
include = ["spiral_lab*"]
